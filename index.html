<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aderet</title>
<style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:Arial,sans-serif; background:#f7f1ed; color:#5e4b52; }
    .sidebar{ width:260px; height:100vh; background:#ead5cf; position:fixed; left:0; top:0; padding:110px 25px; box-shadow:5px 0 20px rgba(0,0,0,0.05); }
    .contenido{ margin-left:260px; padding:60px; }
    .pagina{ display:none; }
    .pagina.activa{ display:block; }
    .grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:22px; }
    .producto{ background:white; border-radius:22px; overflow:hidden; cursor:pointer; }
    .producto img{ width:100%; height:240px; object-fit:cover; }
    .producto-container{ display:flex; gap:50px; }
    .galeria{ width:50%; }
    .imagen-principal img{ width:100%; height:550px; object-fit:cover; border-radius:25px; }
    .miniaturas-container{ display:flex; gap:15px; margin-top:15px; }
    .miniatura{ width:80px; height:80px; border-radius:12px; border:2px solid #ead5cf; cursor:pointer; overflow:hidden; }
    .miniatura img{ width:100%; height:100%; object-fit:cover; }
    .btn{ display:inline-block; margin-top:35px; background:#8a5d6b; color:white; padding:18px 40px; border-radius:15px; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>

<div class="sidebar">
    <div style="font-size:42px; font-weight:bold; color:#8a5d6b; margin-bottom:50px;">Aderet</div>
    <div class="menu-item" onclick="mostrarPagina('inicio')">Inicio</div>
    <div class="menu-item" onclick="mostrarPagina('sabanas')">Sábanas</div>
</div>

<div class="contenido" id="contenedorPrincipal">
    <section class="pagina activa" id="inicio">
        <h1>Bienvenida a Aderet</h1>
    </section>

    <section class="pagina" id="sabanas">
        <h2 style="margin-bottom:40px;">Sábanas</h2>
        <div class="grid">
            <!-- Solo 5 productos como tenés en tus archivos -->
            <div class="producto" onclick="cargarProducto('sabanas', 1)">
                <img src="sabanas1_1-1.jpeg">
                <h3>Juego de Sábanas</h3>
            </div>
            <div class="producto" onclick="cargarProducto('sabanas', 2)">
                <img src="sabanas1_2-1.jpeg">
                <h3>Sábana Torero</h3>
            </div>
        </div>
    </section>

    <section class="pagina" id="detalle">
        <div id="detalleContenido"></div>
    </section>
</div>

<script>
function mostrarPagina(id) {
    document.querySelectorAll('.pagina').forEach(p => p.classList.remove('activa'));
    document.getElementById(id).classList.add('activa');
}

function cargarProducto(cat, num) {
    mostrarPagina('detalle');
    const container = document.getElementById('detalleContenido');
    container.innerHTML = `
        <button onclick="mostrarPagina('sabanas')">Volver</button>
        <div class="producto-container">
            <div class="galeria">
                <div class="imagen-principal">
                    <img id="imgPrincipal" src="${cat}${num}_1-1.jpeg">
                </div>
                <div class="miniaturas-container">
                    <div class="miniatura" onclick="document.getElementById('imgPrincipal').src='${cat}${num}_1-1.jpeg'"><img src="${cat}${num}_1-1.jpeg"></div>
                    <div class="miniatura" onclick="document.getElementById('imgPrincipal').src='${cat}${num}_1-2.jpeg'"><img src="${cat}${num}_1-2.jpeg"></div>
                </div>
            </div>
            <div class="producto-info">
                <h1>Producto ${num}</h1>
                <a class="btn" href="https://wa.me/5491158203956" target="_blank">Consultar</a>
            </div>
        </div>
    `;
}
</script>
</body>
</html>
